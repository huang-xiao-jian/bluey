# 用例稳定标识
id: identify-fulfillment-workers
# 用例标题
title: 从订单履约用例中识别职责抽象及其实现方式
description: |
  验证 Skill 能够从清晰用例中识别业务工人，将人工介入与自动化策略表达为
  抽象职责的实现方式，并排除岗位名和技术组件对命名的干扰。

input:
  # 用例输入提示
  prompt: |
    请使用简体中文回答。使用 $discover-workers 从以下用例规约中识别业务工人。
    只输出最终的业务工人发现结果。

    # 处理订单履约

    ## 参与者

    - 主要参与者：客户
    - 协作参与者：仓库

    ## 基本事件流

    1. 客户提交已支付订单。
    2. 系统登记订单并检查库存。
    3. 库存充足时，系统预留库存并将订单置为待发货。
    4. 履约负责人检查高风险订单，决定继续履约或暂停订单。
    5. 仓库确认拣货完成。
    6. 系统生成发货指令。

    ## 异常事件流

    1. 订单进入待发货状态超过二十四小时时，系统自动识别超时订单并升级处理。
    2. 运营人员确认继续等待或取消订单。
    3. 取消订单后，系统释放库存并通知客户。

    ## 业务规则

    - 高风险订单必须经过明确的继续履约决定才能生成发货指令。
    - 待发货超过二十四小时的订单必须进入升级处理。

    ## 实现备注

    - 超时扫描由每十分钟运行一次的 CronJob 触发。
    - 订单状态保存在 Order 表中。

# 输出断言
expect:
  must_contain:
    - "# 业务工人发现结果"
    - "## 业务工人清单"
    - "## 用例—业务工人职责映射"
    - "## 待澄清问题"
    - "**业务目标**"
    - "**职责边界**"
    - "**识别依据**"
    - "**人主动介入**"
    - "**自动化策略**"
    - "超时"
  must_not_contain:
    - "### 履约负责人"
    - "### 运营人员"
    - "### CronJob"
    - "### Order 表"
    - "{业务工人名称}"
    - "<!--"

judge:
  # 断言评判类型
  type: rule_based
  success:
    - output_matches:
        all:
          - "(?m)^# 业务工人发现结果$"
          - "(?m)^## 业务工人清单$"
          - "(?m)^## 用例—业务工人职责映射$"
          - "(?m)^## 待澄清问题$"
          - "(?s)\\*\\*人主动介入\\*\\*.*\\*\\*自动化策略\\*\\*"
        not:
          - "(?m)^### (履约负责人|运营人员|CronJob|Order 表)$"
          - "\\{[^}]+\\}|<!--"

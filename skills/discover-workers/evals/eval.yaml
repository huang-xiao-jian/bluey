# 配置格式版本
schema_version: v1alpha1

environment:
  # 评测运行环境
  type: none

skills:
  - source: local_path
    path: .

engine:
  # 评测引擎名称
  name: codex

cases:
  # 评测用例文件列表
  files:
    - evals/cases/identify-fulfillment-workers.yaml
    - evals/cases/reject-ambiguous-requirement.yaml
  defaults:
    timeout_seconds: 120
    max_turns: 1

report:
  # 报告输出格式
  formats: [json]

# 报告中使用的稳定用例标识，与文件名一致。
id: identify-library-concepts
# 用例列表和报告中显示的摘要。
title: 从清晰的图书借阅用例规约中识别业务概念
description: |
  验证 Skill 能够迁移到参考案例之外的业务领域，输出可追溯的概念和关系，
  同时排除实现备注中的页面、接口、数据库表和缓存等技术元素。

input:
  # 发送给 Agent 的真实单轮用户请求。
  prompt: |
    请使用简体中文回答。使用 $discover-concepts 从以下用例规约中识别业务概念。
    只输出最终的业务概念识别结果。

    # 借阅馆藏图书

    ## 参与者

    - 主要参与者：读者
    - 协作参与者：馆藏管理系统

    ## 简要说明

    读者选择一本可借图书，系统核验借阅资格并登记借阅；读者随后可以归还图书。

    ## 前置条件

    1. 读者账户处于有效状态。
    2. 馆藏图书当前可借。

    ## 基本事件流

    1. 读者提交要借阅的馆藏图书。
    2. 系统核验读者没有未缴清的逾期费用，且未超过五本的借阅上限。
    3. 系统创建借阅记录，记录借出日期和应还日期。
    4. 馆藏管理系统将该馆藏图书标记为已借出。
    5. 系统向读者显示借阅成功及应还日期。

    ## 备选事件流

    ### 借阅资格不满足

    1. 如果读者存在未缴清的逾期费用，或已经借阅五本图书，系统拒绝本次借阅。
    2. 系统说明拒绝原因，不创建借阅记录。

    ### 归还图书

    1. 读者提交已借出的馆藏图书。
    2. 系统完成对应借阅记录，并将实际归还日期记入该记录。
    3. 馆藏管理系统将馆藏图书恢复为可借状态。
    4. 如果实际归还日期晚于应还日期，系统生成逾期费用。

    ## 后置条件

    - 借阅成功后，借阅记录有效，馆藏图书不可被其他读者借阅。
    - 归还成功后，借阅记录已经完成，馆藏图书可以再次借阅。

    ## 业务规则

    - 每位读者同时最多借阅五本图书。
    - 存在未缴清逾期费用的读者不得新增借阅。
    - 每条借阅记录只对应一位读者和一本馆藏图书。

    ## 实现备注

    - 借阅页面调用 REST API。
    - BorrowRecord 表保存数据，Redis 缓存馆藏状态。

# 在 judge 前执行的低成本输出门禁。
expect:
  must_contain:
    - "# 业务概念识别结果"
    - "## 概念清单"
    - "## 概念关系"
    - "读者"
    - "馆藏图书"
    - "借阅记录"
    - "逾期费用"
    - "**业务含义**"
    - "**识别依据**"
  must_not_contain:
    - "REST API"
    - "BorrowRecord"
    - "Redis"
    - "{概念名称}"
    - "<!--"

judge:
  # 使用确定性规则检查输出结构、核心概念、关系及技术噪声过滤。
  type: rule_based
  success:
    - output_matches:
        all:
          - "(?m)^# 业务概念识别结果$"
          - "(?m)^## 概念清单$"
          - "(?m)^## 概念关系$"
          - "(?m)^### .+ (泛化|组合|聚合|关联|依赖) .+$"
        not:
          - "(?i)(REST API|BorrowRecord|Redis)"
          - "\\{[^}]+\\}|<!--"
